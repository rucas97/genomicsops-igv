<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/igv@2.15.11/dist/igv.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #06080A; color: #00E5FF; font-family: sans-serif; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #06080A; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #12171C; border-top: 4px solid #00E5FF; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div>Loading Local Genome...</div>
    </div>
    <div id="igvDiv"></div>
    <script>
        var options = {
            reference: {
                id: "local",
                name: "Local Test Genome",
                fastaURL: "genome/local.fa",
                indexURL: "genome/local.fa.fai"
            },
            locus: "chr1:1-10000",
            showNavigation: true,
            showRuler: true
        };
        var igvDiv = document.getElementById("igvDiv");
        igv.createBrowser(igvDiv, options).then(function (browser) {
            window.igv = { browser: browser };
            document.getElementById("loader").style.display = "none"; 
        }).catch(function(err) {
            document.getElementById("loader").innerHTML = "<div style='color:#FF0055'>Error: " + err + "</div>";
        });
    </script>
</body>
</html>
